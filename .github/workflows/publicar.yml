# Publica o site no GitHub Pages.
#
# Faltam dois passos, ambos de uma só vez e ambos do lado do GitHub, porque
# nenhum deles é permitido a um workflow:
#
#   1. Juntar este ramo ao `main`. O ambiente `github-pages` só aceita, por
#      omissão, publicações vindas do ramo principal do repositório.
#   2. Settings → Pages → Build and deployment → Source: GitHub Actions.
#      O token de um workflow não tem permissão para criar o site do Pages —
#      tentou-se, e a resposta foi «Resource not accessible by integration».
#
# Feito isso, cada envio para o `main` põe o site no ar sozinho. Não há passo
# de compilação: o que está no repositório é o que fica publicado.

name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; as que ficarem em fila esperam pela anterior.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Ir buscar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Pages
        uses: actions/configure-pages@v5
        with:
          # Liga o Pages sozinho se o token tiver permissão para isso. Quando
          # não tem, o passo 2 do cabeçalho resolve.
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pôr no ar
        id: publicacao
        uses: actions/deploy-pages@v4
