# Publica o site no GitHub Pages sempre que houver uma alteração.
#
# Para ligar, uma única vez, no GitHub:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# A partir daí, cada envio para um dos ramos abaixo põe o site no ar sozinho.
# Não há passo de compilação: o site é HTML, CSS e JavaScript simples, e o que
# está no repositório é exactamente o que fica publicado.

name: Publicar o site

on:
  push:
    branches:
      - main
      - claude/beauty-salon-website-kb3fgm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; as que estiverem em fila esperam pela anterior.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Ir buscar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pôr no ar
        id: publicacao
        uses: actions/deploy-pages@v4
